name: Labeler

# pull_request_target gives the token write access on pull requests from forks.
# This workflow never checks out the pull request code, which keeps that safe.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
