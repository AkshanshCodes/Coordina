name: Bug report
description: Something does not work as documented or as expected.
title: "bug: "
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Security issues must **not** be reported here: use a [private security advisory](https://github.com/Neptune2k21/Coordina/security/advisories/new) instead.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of actions, requests or commands that shows the bug.
      placeholder: |
        1. Sign in as a workspace member
        2. Open /app/projects
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Web app
        - Graph engine
        - Infrastructure / CI / Docker
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, .NET / Node / pnpm / Docker versions when relevant.

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant output. It is rendered as code, so no backticks are needed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
