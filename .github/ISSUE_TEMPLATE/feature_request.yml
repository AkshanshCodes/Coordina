name: Feature request
description: Propose a new capability or a change to an existing one.
title: "feat: "
labels: ["type: feature", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Coordina is a pre-MVP foundation. Proposals that make the platform shape stronger are more likely to be accepted than isolated product fragments.
        For open-ended ideas or questions, start a [discussion](https://github.com/Neptune2k21/Coordina/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How Coordina should behave. API shapes or UI sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - API
        - Web app
        - Graph engine
        - Infrastructure / CI / Docker
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself once it is accepted.
