version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: dependencies", "area: api"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: dependencies", "area: web"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["type: dependencies", "area: infra"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels: ["type: dependencies", "area: infra"]
    commit-message:
      prefix: chore
      include: scope
